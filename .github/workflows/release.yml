name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Build wordflow (release, macOS)
        run: cargo build --release -p deckcraft

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Create macOS app bundle
        run: |
          APP_BUNDLE="Slideflow.app"
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp target/release/deckcraft "$APP_BUNDLE/Contents/MacOS/deckcraft"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>CFBundleDisplayName</key>\n\t<string>Slideflow</string>\n\t<key>CFBundleIdentifier</key>\n\t<string>com.slideflow.app</string>\n\t<key>CFBundleExecutable</key>\n\t<string>deckcraft</string>\n\t<key>CFBundleIconFile</key>\n\t<string>Slideflow.icns</string>\n\t<key>CFBundleName</key>\n\t<string>Slideflow</string>\n\t<key>CFBundlePackageType</key>\n\t<string>APPL</string>\n\t<key>CFBundleShortVersionString</key>\n\t<string>%s</string>\n\t<key>CFBundleVersion</key>\n\t<string>%s</string>\n\t<key>NSHumanReadableCopyright</key>\n\t<string>© Reach Neo</string>\n</dict>\n</plist>\n' "$VERSION" "$VERSION" > "$APP_BUNDLE/Contents/Info.plist"

      - name: Create macOS DMG
        run: |
          mkdir -p dist
          hdiutil create -srcfolder Slideflow.app -ov -format UDZO "dist/slideflow-${VERSION}-macos-arm64.dmg"

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes --prerelease || true
          gh release upload "$GITHUB_REF_NAME" "dist/slideflow-${VERSION}-macos-arm64.dmg" -R "$GITHUB_REPOSITORY" --clobber

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Build wordflow (release, Windows)
        run: cargo build --release -p deckcraft

      - name: Extract version from tag
        run: echo "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Create Windows portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/deckcraft.exe -DestinationPath "dist/slideflow-${{ env.VERSION }}-windows-x64-portable.zip"

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes --prerelease || true
          gh release upload "$GITHUB_REF_NAME" "dist/slideflow-${VERSION}-windows-x64-portable.zip" -R "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Generate SHA256SUMS.txt from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" --dir dist --pattern "*"
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes --prerelease || true
          gh release upload "$GITHUB_REF_NAME" "dist/SHA256SUMS.txt" -R "$GITHUB_REPOSITORY" --clobber
